name: Daily Tender Ingestion

on:
  schedule:
    - cron: '0 2 * * *'   # 07:30 IST = 02:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright browsers are not cached by setup-python; cache them manually.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Always run: 'playwright install chromium' also pulls the matching
      # chrome-headless-shell build. Skipping it on a cache hit left an older
      # cache without the current headless-shell binary, which made all
      # Playwright job scrapers (up_jobs / upsssc) fail with "Executable
      # doesn't exist". Idempotent + fast when already present.
      - name: Install Playwright browser (chromium + headless shell)
        run: playwright install --with-deps chromium

      # Surface silent data-loss causes loudly. Missing secrets don't crash the
      # run (partial data is better than none), but they show up as warnings on
      # the run and a banner in the job summary so a degraded run is never quiet.
      - name: Preflight — check scraper secrets
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_HTTPS_PROXY:  ${{ secrets.SCRAPER_HTTPS_PROXY }}
        run: |
          echo "## Scraper preflight" >> "$GITHUB_STEP_SUMMARY"
          degraded=0

          if [ -z "$SCRAPER_HTTPS_PROXY" ]; then
            echo "::warning title=No India proxy::SCRAPER_HTTPS_PROXY is unset. GitHub's Azure US IPs are geo-blocked by many NIC/gov.in portals, so several scrapers may return 0 rows. Set an India-based HTTPS proxy secret to get full portal data."
            echo "- ⚠️ **SCRAPER_HTTPS_PROXY unset** — NIC/gov.in portals may geo-block Azure IPs; expect reduced portal data." >> "$GITHUB_STEP_SUMMARY"
            degraded=1
          else
            echo "- ✅ SCRAPER_HTTPS_PROXY set" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning title=No LLM key::GEMINI_API_KEY is unset. Newspaper OCR and AI-extracted portals (WRD, res.cg, Balrampur, etc.) will be skipped."
            echo "- ⚠️ **GEMINI_API_KEY unset** — newspaper OCR and AI-extracted portals will be skipped." >> "$GITHUB_STEP_SUMMARY"
            degraded=1
          else
            echo "- ✅ GEMINI_API_KEY set" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_SERVICE_KEY" ] && [ -z "$SUPABASE_KEY" ]; }; then
            echo "::warning title=No Supabase target::SUPABASE_URL and a key are required to publish scraped data to the app; without them the run only writes local CSVs that are discarded when the job ends."
            echo "- ⚠️ **Supabase secrets missing** — scraped data will not reach the app." >> "$GITHUB_STEP_SUMMARY"
            degraded=1
          else
            echo "- ✅ Supabase target configured" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$degraded" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ℹ️ Running in a **degraded** mode — some sources will be skipped or reduced. See warnings above." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ✅ All scraper secrets present — running at full coverage." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run ingestion pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL:           ${{ secrets.FROM_EMAIL }}
          APP_URL:              ${{ secrets.APP_URL }}
          # Optional: route scrapers through an India-based proxy so NIC/gov.in
          # portals that geo-block GitHub's Azure IPs (pwd_cg, dprcg, samvad,
          # psc.cg.gov.in, gem, …) become reachable. `requests` honors these
          # automatically; leave the secrets unset to run direct as before.
          HTTPS_PROXY:          ${{ secrets.SCRAPER_HTTPS_PROXY }}
          HTTP_PROXY:           ${{ secrets.SCRAPER_HTTPS_PROXY }}
          NO_PROXY:             ${{ secrets.SCRAPER_NO_PROXY }}
          # Free-tier OCR pacing. Defaults keep a FREE gemini key under its
          # ~10 req/min limit with no config; override only to tune. Lower the
          # RPM if you still see 429s, raise it if you move to a paid key.
          NEWSPAPER_OCR_RPM:          ${{ vars.NEWSPAPER_OCR_RPM }}
          NEWSPAPER_OCR_PACE_SECONDS: ${{ vars.NEWSPAPER_OCR_PACE_SECONDS }}
        run: python ingest.py
