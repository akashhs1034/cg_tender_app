org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This machine has ~4 GB RAM; keep Gradle lean (the old -Xmx8G crashed the JVM).
org.gradle.workers.max=1
android.useAndroidX=true
# AGP 9 provides the new Android DSL and Kotlin compiler directly. Keep both
# enabled so Kotlin-based Flutter plugins are compiled without the legacy KGP.
android.newDsl=true
android.builtInKotlin=true
