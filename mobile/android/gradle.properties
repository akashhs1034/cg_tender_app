org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This machine has ~4 GB RAM; keep Gradle lean (the old -Xmx8G crashed the JVM).
org.gradle.workers.max=1
android.useAndroidX=true
# Flutter 3.44.3 still reads AGP's legacy DSL interface, while AGP 9's built-in
# Kotlin must stay enabled so Kotlin-based plugins (including file_picker) compile.
android.newDsl=false
android.builtInKotlin=true
