org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# This machine has ~4 GB RAM; keep Gradle lean (the old -Xmx8G crashed the JVM).
org.gradle.workers.max=1
android.useAndroidX=true
# Flutter 3.44 keeps this compatibility bridge for plugins that have not all
# migrated to AGP 9's built-in Kotlin yet.
android.newDsl=false
android.builtInKotlin=false
